apiVersion: apps/v1
kind: Deployment
metadata:
  name: gym-membership
  namespace: gym-mgmt
  labels:
    app: gym-membership
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gym-membership
  template:
    metadata:
      labels:
        app: gym-membership
    spec:
      containers:
      - name: gym-membership
        image: demo_image:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
